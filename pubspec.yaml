name: smartrun
description: SmartRun Coach - personal interval training running app.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.0
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  flutter_tts: ^4.2.2
  vibration: ^3.1.3
  wakelock_plus: ^1.4.0
  image_picker: ^1.1.2
  image_cropper: ^11.0.0
  path_provider: ^2.1.4
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
